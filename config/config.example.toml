# NuvCode Backend — Example Config
# Copy to config/config.toml and fill in your values.
# All values can be overridden via env vars with NUV_ prefix.
# Example: NUV_DATABASE__URL=postgresql://user:pass@localhost/nuvcode

[server]
host = "0.0.0.0"
port = 7444
# public_url = "http://your-vps-ip:7444"   # Optional: override auto-detected URL

[gateway]
timeout_secs = 120

[auth]
api_key_header = "Authorization"
api_key_prefix = "Bearer "
# admin_username = "admin"                  # Set to enable admin login
# admin_password = "your-admin-password"    # Required when admin_username is set
# jwt_secret = "your-jwt-secret-change-me"  # Optional, falls back to a dev default

[database]
url = "postgresql://nuvcode:***@localhost/nuvcode"
